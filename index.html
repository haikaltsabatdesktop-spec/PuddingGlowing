<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PuddingGlowing.co</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #f5efe6;

  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  text-align: center;
  max-width: 420px;
  width: 90%;
}

.card {
  background: white;
  padding: 35px 25px;
  border-radius: 18px;
  box-shadow: 0 20px 40px rgba(62,39,35,0.15);
}

h1 {
  color: #3e2723;
  margin-bottom: 8px;
  letter-spacing: 1px;
}

.tagline {
  color: #6d4c41;
  margin-bottom: 25px;
  font-size: 14px;
}

.product-image {
  width: 100%;
  max-width: 250px;
  border-radius: 15px;
  margin-bottom: 25px;
}

.menu-box {
  background: #faf7f2;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  border: 1px solid #eee;
}

.menu-title {
  font-weight: 600;
  color: #3e2723;
}

.price {
  color: #d4af37;
  font-weight: bold;
  margin-top: 4px;
}

button {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #3e2723;
  color: #d4af37;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s ease;
}

button:hover {
  background: #d4af37;
  color: #3e2723;
}
</style>

</head>
<body>

<div class="container">
  <div class="card">

    <h1>PuddingGlowing Compact Pudding Cup</h1>
    <p class="tagline">Your Daily Dose of Sweet Comfort 🍮</p>

    <!-- Ganti dengan nama gambar kamu -->
    <img src="pudding.png" alt="Pudding Cup" class="product-image">

    <div class="menu-box">
      <div class="menu-title">Oreo Sprinkled</div>
      <div class="price">Rp10.000,00</div>
    </div>

    <div class="menu-box">
      <div class="menu-title">Vanilla Biscuit</div>
      <div class="price">Rp12.000,00</div>
    </div>

    <a href="order.html">
      <button>Pesan Sekarang</button>
    </a>

  </div>
</div>

</body>
</html>
</html>
