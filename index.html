<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pudding Cup Lezat</title>
<link rel="stylesheet" href="style.css">
<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #ffe6f0, #fff5e6);
  margin: 0;
  padding: 0;
}

.container {
  text-align: center;
  padding: 30px 20px;
  max-width: 500px;
  margin: auto;
}

h1 {
  color: #ff4d6d;
  margin-bottom: 10px;
}

.tagline {
  color: #555;
  margin-bottom: 20px;
}

.product-image {
  width: 100%;
  max-width: 300px;
  border-radius: 15px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.1);
  margin-bottom: 25px;
}

.menu-box {
  background: white;
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  margin-bottom: 15px;
}

.menu-title {
  font-weight: bold;
  color: #333;
}

.price {
  color: #ff4d6d;
  font-weight: bold;
}

.order-btn {
  margin-top: 20px;
}

button {
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  background: #ff4d6d;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #e6004c;
}
</style>
</head>
<body>

<div class="container">

  <h1>Pudding Cup Lezat</h1>
  <p class="tagline">Manis, lembut, dan cocok untuk semua kalangan 🍮</p>

  <!-- GANTI dengan nama file gambar kamu -->
  <img src="pudding.png" alt="Pudding Cup" class="product-image">

  <div class="menu-box">
    <div class="menu-title">Pudding Coklat</div>
    <div class="price">Rp5.000</div>
  </div>

  <div class="menu-box">
    <div class="menu-title">Pudding Strawberry</div>
    <div class="price">Rp5.000</div>
  </div>

  <div class="order-btn">
    <a href="order.html">
      <button>Pesan Sekarang</button>
    </a>
  </div>

</div>

</body>
</html>
