<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>Order Page</title>
<style>
body {

  background: #fff0f5;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.container {
  background:white;
  padding:25px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  display:flex;
  flex-direction:column;
  gap:15px;
  text-align:center;
}
button {
  padding:12px;
  border:none;
  border-radius:8px;
  background:#ff4d6d;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
button:hover {
  background:#e6004c;
