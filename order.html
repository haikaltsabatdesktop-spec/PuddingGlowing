<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesan Pudding Cup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Form Pemesanan Pudding Cup</h1>

  <label>Nama Pembeli:</label>
  <input type="text" id="nama" placeholder="Tulis namamu...">

  <label>Pilih Rasa:</label>
  <select id="rasa">
    <option value="5000">Coklat - Rp5.000</option>
    <option value="5000">Strawberry - Rp5.000</option>
    <option value="6000">Matcha - Rp6.000</option>
  </select>

  <label>Jumlah:</label>
  <input type="number" id="jumlah" value="1" min="1">

  <h3>Total: Rp <span id="total">5000</span></h3>

  <button onclick="pesan()">Pesan Sekarang</button>
</div>

<script src= "script.js" > </script>
</body>
</html>
